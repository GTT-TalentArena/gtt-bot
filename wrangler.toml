name = "gtt-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Solo el resumen diario. La sincronización privada vive en GitHub Actions.
[triggers]
crons = ["0 7 * * *"]

[observability]
enabled = true

# Secrets (no van aquí): npx wrangler secret put DISCORD_PUBLIC_KEY / DISCORD_APPLICATION_ID / DISCORD_BOT_TOKEN
# Archivo privado leído por /archivo: SUPABASE_URL / SUPABASE_SECRET_KEY.
# Opcional: GITHUB_TOKEN (token de solo lectura) si la API de GitHub da 403 por límite
